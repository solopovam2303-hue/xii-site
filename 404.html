<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — XII</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f0e0e">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&family=Unbounded:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0e0e;--milk:#f0ede3;--red:#fe4332}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;height:100%;color:var(--milk)}
body{font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(20px,6vw,80px);position:relative;overflow:hidden}
.glow{position:absolute;left:-10%;right:-10%;bottom:-30%;height:70%;z-index:-1;background:radial-gradient(ellipse 60% 74% at 50% 84%,rgba(254,67,50,.85) 0%,rgba(222,52,36,.5) 30%,rgba(140,28,18,.2) 56%,rgba(15,14,14,0) 80%)}
.mark{position:absolute;left:clamp(20px,6vw,80px);top:clamp(20px,4vw,40px);font-family:"Unbounded",sans-serif;font-size:22px;color:var(--milk);text-decoration:none}
.n{margin:0 0 12px;font-family:"Unbounded",sans-serif;font-weight:400;font-size:clamp(88px,20vw,240px);line-height:.95;color:var(--red)}
h1{margin:0 0 14px;font-family:"Unbounded",sans-serif;font-weight:400;font-size:clamp(22px,3.4vw,40px);line-height:1.12;color:rgba(249,236,234,.9)}
p{margin:0 0 30px;font-weight:300;font-size:clamp(16px,1.5vw,19px);line-height:1.45;color:rgba(240,237,227,.62);max-width:30em}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 26px;border-radius:2000px;border:1px solid transparent;font-size:17px;line-height:1.2;color:#fff;text-decoration:none;transition:transform .25s ease,background .25s ease,color .25s ease}
.btn:hover{transform:translateY(-1px)}
.red{background:var(--red)}
.line{border-color:var(--milk)}
.line:hover{background:var(--milk);color:#0f0e0e}
@media (max-width:600px){.btn{flex:1 1 100%}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<a class="mark" id="home0" href="/">XII</a>
<div class="n">404</div>
<h1>Такой страницы нет</h1>
<p>Возможно, ссылка устарела или в ней опечатка. Вернитесь на главную или напишите нам, мы подскажем.</p>
<div class="row">
  <a class="btn red" id="home" href="/">На главную</a>
  <a class="btn line" href="https://t.me/elenanikolaeva12" target="_blank" rel="noopener">Написать в Telegram</a>
</div>
<script>
/* на github.io сайт лежит в папке репозитория, на своём домене — в корне */
(function () {
  var base = '/';
  if (/\.github\.io$/.test(location.hostname)) {
    var seg = location.pathname.split('/')[1];
    if (seg) base = '/' + seg + '/';
  }
  ['home', 'home0'].forEach(function (id) { document.getElementById(id).setAttribute('href', base); });
})();
</script>
</body>
</html>
